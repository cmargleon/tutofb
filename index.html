<!doctype html>
<html lang="es" class="theme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230F1422'/%3E%3Cpath d='M18 20h28L34 44H18l12-24Z' fill='%234F6BDE'/%3E%3C/svg%3E"
    />
    <title>Tuto Firebase</title>
    <script>
      (() => {
        try {
          const savedTheme = window.localStorage.getItem('tutofb-theme');
          const theme = savedTheme === 'light' ? 'light' : 'dark';
          document.documentElement.classList.remove('theme-light', 'theme-dark');
          document.documentElement.classList.add(`theme-${theme}`);
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.classList.add('theme-dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
